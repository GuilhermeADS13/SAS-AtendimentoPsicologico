name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    name: Typecheck, testes e build
    runs-on: ubuntu-latest

    # Postgres efêmero para os testes de integração (funcionais).
    services:
      postgres:
        # pgvector/pgvector:pg16 e a imagem oficial do pgvector sobre o postgres:16.
        # Com o `postgres:16` puro a extensao nao existe e a migration 0014
        # (CREATE EXTENSION IF NOT EXISTS vector) falha com
        # 'extension "vector" is not available', derrubando o CI inteiro antes
        # mesmo de rodar os testes.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Ativar pnpm (corepack)
        run: |
          corepack enable
          corepack prepare pnpm@10.4.1 --activate

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm check

      # Caractere de controle invisível (o `\b` que vira BACKSPACE num regex).
      # O hook de pre-commit já barra na máquina de quem commita; este passo cobre
      # quem usou --no-verify ou clonou sem rodar o install que instala o hook.
      # Passo próprio para a falha dizer o que é, em vez de sumir no meio da suíte.
      - name: Caractere invisível
        run: pnpm lint:invisivel

      # Sem DATABASE_URL: exercita o comportamento sem banco (procedures retornam
      # vazio / rejeitam). O teste de integração fica SKIPPED aqui.
      # Com cobertura: abaixo do piso de vitest.config.ts o passo falha.
      - name: Testes unitários (com piso de cobertura)
        run: pnpm test:coverage

      - name: Aplicar migrations no Postgres de teste
        run: pnpm drizzle-kit migrate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/testdb

      # A 0016 reconcilia objetos que ja existem no banco de producao, entao ela
      # PRECISA ser idempotente -- senao o proximo deploy quebra. Reaplicar o
      # arquivo sobre o banco que a migration acabou de montar exercita
      # exatamente esse caminho. ON_ERROR_STOP faz qualquer statement nao
      # idempotente derrubar o job. Os marcadores "--> statement-breakpoint" sao
      # comentarios SQL, entao o psql os ignora.
      - name: Migration 0016 e idempotente (reaplicar sobre banco ja migrado)
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -q -f drizzle/0016_simple_ultragirl.sql
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/testdb

      # Migracoes em drizzle/migrations/ NAO sao aplicadas pelo `drizzle-kit
      # migrate`, que olha so ./drizzle. Sem elas, o SELECT do Drizzle -- que
      # expande TODAS as colunas do schema.ts -- quebra com "column does not
      # exist". A lista escrita a mao parou na 0032 e deixou o CI vermelho de
      # 21/10 a 04/11/2026; o script aplica a pasta inteira, em ordem, e pula so
      # as que dependem de objetos do Supabase (ver scripts/migracoes-de-teste.sh).
      - name: Aplicar migracoes (drizzle/migrations) no Postgres de teste
        run: sh scripts/migracoes-de-teste.sh
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/testdb

      # Fluxo funcional completo contra o Postgres real (perfil → paciente →
      # agendamento → confirmação → sessão → documento + checagem de IDOR).
      - name: Testes de integração (funcionais)
        run: pnpm test:integration
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/testdb
          RUN_INTEGRATION: "true"

      - name: Build de produção
        run: pnpm build
