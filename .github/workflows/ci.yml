name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    name: Typecheck, testes e build
    runs-on: ubuntu-latest

    # Postgres efêmero para os testes de integração (funcionais).
    services:
      postgres:
        # pgvector/pgvector:pg16 e a imagem oficial do pgvector sobre o postgres:16.
        # Com o `postgres:16` puro a extensao nao existe e a migration 0014
        # (CREATE EXTENSION IF NOT EXISTS vector) falha com
        # 'extension "vector" is not available', derrubando o CI inteiro antes
        # mesmo de rodar os testes.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Ativar pnpm (corepack)
        run: |
          corepack enable
          corepack prepare pnpm@10.4.1 --activate

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm check

      # Sem DATABASE_URL: exercita o comportamento sem banco (procedures retornam
      # vazio / rejeitam). O teste de integração fica SKIPPED aqui.
      - name: Testes unitários
        run: pnpm test

      - name: Aplicar migrations no Postgres de teste
        run: pnpm drizzle-kit migrate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/testdb

      # A 0016 reconcilia objetos que ja existem no banco de producao, entao ela
      # PRECISA ser idempotente -- senao o proximo deploy quebra. Reaplicar o
      # arquivo sobre o banco que a migration acabou de montar exercita
      # exatamente esse caminho. ON_ERROR_STOP faz qualquer statement nao
      # idempotente derrubar o job. Os marcadores "--> statement-breakpoint" sao
      # comentarios SQL, entao o psql os ignora.
      - name: Migration 0016 e idempotente (reaplicar sobre banco ja migrado)
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -q -f drizzle/0016_simple_ultragirl.sql
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/testdb

      # Migracoes que ALTERAM tabelas existentes (ADD COLUMN) vivem em
      # drizzle/migrations/ e NAO sao aplicadas pelo `drizzle-kit migrate`, que
      # olha so ./drizzle (ver drizzle.config.ts: out). Sem aplica-las, o SELECT
      # do Drizzle -- que expande TODAS as colunas do schema.ts -- quebra no teste
      # de integracao com "column does not exist" (foi o que derrubou o CI quando
      # therapists.phone entrou). Todas sao ADD COLUMN IF NOT EXISTS, seguras de
      # reaplicar. Ao criar uma migracao de coluna nova em drizzle/migrations/,
      # adicione o arquivo a esta lista.
      - name: Aplicar migracoes de coluna (drizzle/migrations) no Postgres de teste
        run: |
          for f in \
            drizzle/migrations/0022_onboarding_seen.sql \
            drizzle/migrations/0023_therapist_phone.sql \
            drizzle/migrations/0025_patient_guardian.sql \
            drizzle/migrations/0026_patient_user_fk.sql \
            drizzle/migrations/0027_prontuario_cfp.sql \
            drizzle/migrations/0028_note_templates.sql \
            drizzle/migrations/0029_chat_messages.sql \
            drizzle/migrations/0030_prontuario_model.sql; do
            echo "aplicando $f"
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -q -f "$f"
          done
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/testdb

      # Fluxo funcional completo contra o Postgres real (perfil → paciente →
      # agendamento → confirmação → sessão → documento + checagem de IDOR).
      - name: Testes de integração (funcionais)
        run: pnpm test:integration
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/testdb
          RUN_INTEGRATION: "true"

      - name: Build de produção
        run: pnpm build
