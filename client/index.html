<!doctype html>
<html lang="pt-BR">

  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0" />
    <title>VozInterior — Atendimento Psicológico Online</title>
    <meta
      name="description"
      content="VozInterior: agendamento, prontuário e videochamada para atendimento psicológico online." />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#215756" />
    <!-- Aviso da primeira abertura: aparece já com o HTML, antes do JavaScript
         (2 a 5 s no celular, mais se o servidor estiver acordando). O React troca
         o conteúdo do #root quando monta. -->
    <style>
      .carregando-inicial { min-height: 100vh; display: flex; flex-direction: column; align-items: center;
        justify-content: center; gap: 14px; background: #fbf8f4; color: #215756;
        font: 500 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
      .carregando-inicial img { width: 56px; height: 56px; border-radius: 14px; animation: pulso 1.4s ease-in-out infinite; }
      @keyframes pulso { 50% { opacity: .45; transform: scale(.94); } }
      @media (prefers-reduced-motion: reduce) { .carregando-inicial img { animation: none; } }
    </style>
  </head>

  <body>
    <div id="root">
      <div class="carregando-inicial" role="status">
        <img src="/vozinterior-mark.png" alt="" />
        <span>Carregando o VozInterior…</span>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>

</html>
