# Blueprint do Render (plano free) — roda o container completo (Express +
# WebSocket + agendador) a partir do Dockerfile. No Render: New → Blueprint →
# conecte este repositório. As variáveis com `sync: false` você preenche no painel.
services:
  - type: web
    name: sas-atendimento-psicologico
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: virginia # us-east (mais perto do Brasil entre as regiões free)
    autoDeploy: true
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production

      # VITE_* são públicas e embutidas no bundle em build time (o Render as
      # repassa como build args para o Dockerfile).
      - key: VITE_SUPABASE_URL
        value: https://icaybuutkfzpqplsqhtb.supabase.co
      - key: VITE_SUPABASE_PUBLISHABLE_KEY
        value: sb_publishable_YzceRGzH1lAlUrdXMLHA8Q_-EPc9yo-

      # Runtime — preencha no painel do Render (não vão para o repositório).
      # DATABASE_URL: use o pooler do Supabase; se a senha tiver @, use %40.
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: SUPABASE_URL
        value: https://icaybuutkfzpqplsqhtb.supabase.co
      - key: OAUTH_SERVER_URL
        value: https://api.manus.im

      # ── E-mails (API HTTP da Brevo) ─────────────────────────────────────
      # NÃO use SMTP aqui: o plano free do Render bloqueia as portas 25/465/587
      # na saída, e todo envio morre em "Connection timeout". A API da Brevo
      # fala HTTPS na 443, que passa. As variáveis SMTP_* abaixo continuam só
      # para desenvolvimento local, onde a 587 abre normalmente.
      # https://render.com/changelog/free-web-services-will-no-longer-allow-outbound-traffic-to-smtp-ports
      # As SMTP_* NÃO são declaradas aqui de propósito. Se estivessem, faltando a
      # chave da Brevo o servidor tentaria SMTP e voltaria a falhar por timeout.
      # Sem elas, o pior caso é dry-run: a notificação fica pendente e é
      # reenviada, em vez de morrer como "failed".
      - key: BREVO_API_KEY # chave da API (Brevo → SMTP & API → API Keys)
        sync: false
      - key: EMAIL_FROM # remetente; precisa estar verificado na Brevo
        value: codexmaciel@gmail.com
      - key: EMAIL_FROM_NAME
        value: VozInterior
      - key: ADMIN_EMAIL # recebe os avisos de solicitação de acesso
        value: suportevozinterior@gmail.com
      # APP_URL não é declarada de propósito: sem ela, os e-mails usam a
      # RENDER_EXTERNAL_URL que o Render injeta, e os links acompanham o nome do
      # serviço sozinhos. Defina APP_URL só quando houver domínio próprio, que o
      # Render não tem como adivinhar.
      - key: NOTIFICATIONS_ENABLED # liga o agendador de lembretes (15 em 15 min)
        value: "true"

      # ── Videochamada: TURN (opcional, recomendado) ──────────────────────
      # Cobre as redes onde o P2P nao conecta (NAT simetrico, firewall
      # corporativo, algumas operadoras). Sem TURN, essas pessoas ficam presas
      # em "Conectando...". Metered tem 500MB/mes gratis, sem cartao.
      # SEGREDO e SEM prefixo VITE_: o bundle e publico, entao a chave fica no
      # servidor, que entrega credenciais temporarias ao cliente.
      - key: METERED_DOMAIN
        sync: false
      - key: METERED_API_KEY
        sync: false
      # Regiao do relay: DEIXE VAZIA. A Metered ja devolve a regiao do painel
      # ("Global (automatico)"), que roteia para o servidor mais proximo.
      - key: METERED_REGION
        sync: false

      # ── Luma (IA) ─────────────────────────────────────────────────
      # Sem estas variáveis o servidor cai no default de getOpenSourceLlmConfig,
      # que é http://localhost:11434/v1 (Ollama local). No Render isso não existe
      # e toda resposta da Luma vira erro de conexão. LLM_API_KEY é SEGREDO:
      # preencha no painel, nunca no repositório.
      - key: LLM_BASE_URL
        value: https://api.groq.com/openai/v1
      # O Groq removeu os modelos Llama; o que existe é o gpt-oss. Um modelo morto
      # aqui faz a Luma responder 404 "model does not exist".
      - key: LLM_MODEL
        value: openai/gpt-oss-120b
      - key: LLM_API_KEY
        sync: false
      # 0 = determinístico. A Luma responde ancorada em registros e no mapa do
      # menu; variação criativa só fazia a mesma pergunta render respostas
      # diferentes sobre o mesmo prontuário.
      - key: LLM_TEMPERATURE
        value: "0"
      - key: LLM_MAX_TOKENS
        value: "800"
      # FAILOVER: quando o Groq principal estoura o rate limit (8000 TPM no free),
      # a Luma cai para este backup — uma SEGUNDA conta Groq (outra chave), com
      # cota propria e fresca. Mesmo endpoint/modelo do principal, entao a mesma
      # qualidade de function calling; so a chave muda. So preencher a chave no
      # painel liga o failover; sem ela, segue so no Groq principal.
      - key: LLM_FALLBACK_1_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: LLM_FALLBACK_1_MODEL
        value: openai/gpt-oss-120b
      - key: LLM_FALLBACK_1_API_KEY # chave de uma SEGUNDA conta Groq — SEGREDO
        sync: false
      # TERCEIRA conta Groq. O provedor so entra na cadeia se as TRES variaveis
      # existirem (ver getLlmProviders): faltando qualquer uma ele e ignorado em
      # silencio, sem erro nenhum. Por isso BASE_URL e MODEL ficam aqui, versionados.
      - key: LLM_FALLBACK_2_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: LLM_FALLBACK_2_MODEL
        value: openai/gpt-oss-120b
      # A chave usa o nome CURTO (sem _API_KEY), que e o que esta no painel. O codigo
      # aceita os dois; se um dia padronizar, LLM_FALLBACK_2_API_KEY tem precedencia.
      - key: LLM_FALLBACK_2 # chave de uma TERCEIRA conta Groq — SEGREDO
        sync: false
      - key: AI_AGENT_ENABLED # false = desliga a Luma na hora (kill switch)
        value: "true"

      # O nome AI_RAG_ENABLED é histórico (a busca em documentos saiu em 2026-10-28),
      # mas a flag continua necessária: no código, toolsEnabled = tools && rag, e sem
      # ela a Luma perde agendar/remarcar/cancelar/pagar. As duas andam juntas.
      - key: AI_RAG_ENABLED
        value: "true"
      - key: AI_CLINICAL_TOOLS_ENABLED
        value: "true"
      # SEGREDO: operações de servidor no Supabase (storage e admin).
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
