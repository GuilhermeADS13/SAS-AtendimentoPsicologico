global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: sas-atendimento-ai
    metrics_path: /metrics
    scheme: http
    static_configs:
      - targets:
          - sas-atendimento:3000
    # Monte um arquivo secreto no container/host do Prometheus.
    # Se o endpoint estiver protegido, remova este bloco apenas em ambiente local.
    bearer_token_file: /etc/prometheus/secrets/sas-metrics-token
